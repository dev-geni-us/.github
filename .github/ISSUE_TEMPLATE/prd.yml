name: "📄 PRD"
description: "하나의 완결된 기능 스펙. Epic의 하위이자 Task의 상위입니다. 기획자가 작성합니다."
title: "[PRD] "
type: "PRD"
labels: ["prd"]
body:
  - type: markdown
    attributes:
      value: |
        PRD는 **"무엇을 어떻게 만드는가"** 를 담습니다.
        크기 기준: **2~4주 , Task 5~15개.**

        처음부터 다 채우지 마세요. **① ② ③ ⑤ 만 채우고 개발팀과 스펙 리뷰**를 잡은 뒤,
        ④ ⑥ ⑦ 은 리뷰 미팅에서 **개발자와 함께** 채웁니다.

  - type: textarea
    id: summary
    attributes:
      label: ① 요약
      description: 3줄 이내. 이 부분만 읽어도 무엇을 만드는지 알 수 있어야 합니다.
      placeholder: |
        가입 직후 사용 목적을 묻는 화면을 추가한다.
        선택한 목적에 맞는 첫 액션 3개를 카드로 추천한다.
        첫 세션 핵심기능 사용률을 22% → 40%로 올리는 것이 목표다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: ③ 범위
      description: 미포함을 반드시 채워주세요. 개발 중 "이것도 되나요?"를 막는 유일한 장치입니다.
      value: |
        **포함**
        -
        -

        **미포함 (이번엔 안 함)**
        -
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: ④ 사용자 시나리오
      description: 정상 흐름과 엣지 케이스. 엣지 케이스가 빠지면 개발 중에 반드시 다시 물어보게 됩니다.
      value: |
        **정상 흐름**
        1. 
        2. 
        3. 

        **엣지 케이스**
        - 중간 이탈 후 재진입하면?
        - 이미 경험한 사용자라면?
        - 네트워크 실패 시?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: ⑤ 요구사항
      description: 우선순위는 MoSCoW. Must만 이번 릴리스 범위입니다.
      value: |
        | ID | 요구사항 | 우선순위 | 영역 |
        |---|---|---|---|
        | FR-1 |  | Must | FE |
        | FR-2 |  | Must | BE |
        | FR-3 |  | Should | FE |

        **비기능**
        - 성능:
        - 접근성:
        - 지원 환경:
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: ⑥ 화면 / 흐름
      placeholder: |
        - 기획서 : https://docs.google.com/document/d/xxx
        - Figma: https://figma.com/file/xxx

        ```
        [가입 완료] → [목적 선택] → [추천 액션] → [홈]
                          ↓ skip
                        [홈]
        ```

  - type: textarea
    id: release
    attributes:
      label: ⑧ 릴리스 계획
      value: |
        - 롤백 조건:
        - 피처 플래그 사용 여부:
        - 목표 릴리스:

  - type: textarea
    id: open
    attributes:
      label: ⑨ 미결 사항
      value: |
        | 항목 | 담당 | 기한 | 상태 |
        |---|---|---|---|
        |  |  |  | 🔴 대기 |

  - type: markdown
    attributes:
      value: |
        ---
        **생성 후 할 일**
        1. 상위 Epic 이슈의 **Sub-issues** 에 이 PRD를 추가
        2. 스펙 리뷰 후 각 서비스 레포에 Task 생성 → 이 PRD의 **Sub-issues** 에 연결
           (다른 레포 이슈는 `Add existing issue` → **전체 URL** 붙여넣기)
